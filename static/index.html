<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 用量</title>
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'system'; } catch (e) {}
</script>
<style>
:root {
  --app: #F4F4F5; --panel: #FFFFFF; --text: #18191B; --muted: #62666D; --faint: #A0A3A9;
  --border: #E4E4E7; --hover: rgba(0,0,0,.04); --active: rgba(0,0,0,.06);
  --thumb: #FFFFFF; --thumb-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.06);
  --opus: #5E6AD2; --sonnet: #3AAE9B; --fable: #C2577F; --haiku: #8B93A1; --other: #A0A3A9;
  --warn: #B45309; --warn-fill: #F59E0B; --danger: #DC2626; --ok: #16A34A;
  --tip: #18191B; --tip-text: #FFFFFF;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --app: #08090A; --panel: #0F1011; --text: #EDEDEF; --muted: #8A8F98; --faint: #4F535A;
  --border: rgba(255,255,255,.08); --hover: rgba(255,255,255,.04); --active: rgba(255,255,255,.07);
  --thumb: #26282C; --thumb-shadow: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
  --opus: #7C86E6; --sonnet: #4FC2AE; --fable: #E07AA3; --haiku: #A2AAB8; --other: #6B7079;
  --warn: #F5A54A; --warn-fill: #F5A54A; --danger: #F06A6A; --ok: #4CB782;
  --tip: #EDEDEF; --tip-text: #08090A;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --app: #08090A; --panel: #0F1011; --text: #EDEDEF; --muted: #8A8F98; --faint: #4F535A;
    --border: rgba(255,255,255,.08); --hover: rgba(255,255,255,.04); --active: rgba(255,255,255,.07);
    --thumb: #26282C; --thumb-shadow: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
    --opus: #7C86E6; --sonnet: #4FC2AE; --fable: #E07AA3; --haiku: #A2AAB8; --other: #6B7079;
    --warn: #F5A54A; --warn-fill: #F5A54A; --danger: #F06A6A; --ok: #4CB782;
    --tip: #EDEDEF; --tip-text: #08090A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--app); }
body {
  color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2 { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--muted); }

.shell { display: flex; align-items: flex-start; max-width: 1480px; margin: 0 auto; }
aside { flex: 0 0 232px; position: sticky; top: 0; padding: 14px 10px; display: flex; flex-direction: column; gap: 18px; min-height: 100vh; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px; font-weight: 600; letter-spacing: -0.01em; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--opus); display: grid; place-items: center; }
.tier { margin-left: auto; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; font-weight: 500; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 1px; }
.nav { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 500; transition: transform 120ms var(--ease-out), background-color 150ms ease; }
.nav[aria-current="true"] { color: var(--text); background: var(--active); }
.nav .count { margin-left: auto; font-size: 11px; }
.appearance { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.label { font-size: 11px; font-weight: 500; color: var(--muted); }

.seg { position: relative; display: flex; padding: 2px; border-radius: 8px; background: var(--active); }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 6px; background: var(--thumb); box-shadow: var(--thumb-shadow); transition: transform 200ms var(--ease-out); }
.seg button { position: relative; flex: 1 1 0; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: transform 120ms var(--ease-out), color 150ms ease; }
.seg button[aria-checked="true"] { color: var(--text); }
.seg.small { border-radius: 7px; }
.seg.small .thumb { border-radius: 5px; }
.seg.small button { width: 64px; height: 26px; border-radius: 5px; }
.seg.small.three { width: 196px; }
.seg.small.three button { width: auto; }
.seg button:active, .nav:active, .more:active { transform: scale(.97); }

main { flex: 1 1 auto; min-width: 0; padding: 8px 8px 8px 0; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-height: calc(100vh - 16px); }
.topbar { position: sticky; top: 0; z-index: 5; height: 46px; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); background: var(--panel); border-radius: 10px 10px 0 0; }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.dot.stale { background: var(--danger); }
.content { padding: 28px 28px 40px; display: flex; flex-direction: column; gap: 32px; }
section { scroll-margin-top: 64px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.sub { margin-top: 4px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); font-weight: 500; }
.badge.warn { color: var(--warn); }
.badge.ok { color: var(--ok); }
.badge.calm { color: var(--muted); }

.kpis { display: flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.kpi { flex: 1 1 176px; min-width: 0; padding: 16px 18px; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); display: flex; flex-direction: column; gap: 10px; }
.kpi-top { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-note { font-size: 12px; color: var(--muted); }
.kpi-value { font-size: 26px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.track { position: relative; height: 4px; border-radius: 2px; background: var(--active); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.track .official { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--text); opacity: .35; }
.track-stack { position: absolute; inset: 0; display: flex; gap: 2px; border-radius: 2px; overflow: hidden; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.kinds .chip .mono { margin-left: 2px; }
.track .tick { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--text); }

.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head .title { display: flex; align-items: baseline; gap: 10px; }
h2 { font-size: 14px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }

.chart-box { border: 1px solid var(--border); border-radius: 10px; padding: 20px 18px 14px; }
.chart { display: flex; gap: 12px; }
.plot-wrap { flex: 1 1 auto; min-width: 0; }
.plot { position: relative; height: 200px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--border); }
.plot.days { gap: 10px; }
.plot.hours { gap: 2px; }
.grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); opacity: .6; }
.budget-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); opacity: .7; }
.col { position: relative; flex: 1 1 0; min-width: 0; height: 100%; display: flex; justify-content: center; align-items: flex-end; }
.bar { display: flex; flex-direction: column-reverse; gap: 1px; border-radius: 4px 4px 0 0; overflow: hidden; }
.days .bar { width: min(40px, 60%); }
.hours .bar { width: 100%; border-radius: 2px 2px 0 0; }
.future { width: min(40px, 60%); height: 100%; border: 1px dashed var(--border); border-bottom: 0; border-radius: 4px 4px 0 0; }
.xlabels { display: flex; gap: 10px; padding-top: 8px; font-size: 12px; color: var(--muted); }
.xlabels > div { flex: 1 1 0; min-width: 0; text-align: center; white-space: nowrap; }
.xlabels .today { color: var(--text); font-weight: 500; }
.xlabels.spread { justify-content: space-between; gap: 0; font-size: 11px; }
.xlabels.spread > div { flex: none; }
.yaxis { position: relative; flex: none; width: 60px; height: 200px; font-size: 11px; color: var(--muted); }
.yaxis span { position: absolute; left: 0; transform: translateY(-50%); white-space: nowrap; }
.yaxis .strong { color: var(--text); }
.curve { position: relative; height: 200px; }
.curve svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.curve .label { position: absolute; transform: translate(10px, 6px); font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--text); }
.curve .label.end { transform: translate(calc(-100% - 10px), -50%); color: var(--warn); }
.curve .label.edge { transform: translate(calc(-100% - 10px), 6px); }
.curve .pt { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 2px solid var(--panel); }
.ln { display: inline-block; width: 14px; border-top: 2px solid; flex: none; }
.tip { position: absolute; left: 50%; z-index: 3; width: max-content; max-width: 220px; padding: 8px 10px; border-radius: 7px; background: var(--tip); color: var(--tip-text); font-size: 12px; pointer-events: none;
  opacity: 0; transform: translate(-50%, 4px) scale(.97); transform-origin: bottom center; transition: opacity 125ms ease-out, transform 125ms ease-out; }
.tip .mono { opacity: .75; }
.col:first-child .tip { left: 0; transform: translate(0, 4px) scale(.97); transform-origin: bottom left; }
.col:last-child .tip { left: auto; right: 0; transform: translate(0, 4px) scale(.97); transform-origin: bottom right; }

.split { display: flex; flex-wrap: wrap; gap: 28px; }
.split > section { flex: 1 1 320px; min-width: 0; }
.effort { display: grid; grid-template-columns: 128px minmax(0, 1fr) 60px 48px; align-items: center; gap: 12px; height: 32px; }
.meter { height: 6px; border-radius: 3px; background: var(--active); }
.meter > div { height: 100%; border-radius: 3px; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-bottom: 4px; }
.model { display: flex; align-items: center; gap: 10px; height: 36px; border-bottom: 1px solid var(--border); }
.right { text-align: right; }
.note { margin-top: 10px; font-size: 12px; color: var(--muted); }

.table { overflow-x: auto; border-top: 1px solid var(--border); }
.rows { min-width: 760px; }
.row { display: grid; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-bottom: 1px solid var(--border); }
.row.agent { grid-template-columns: 16px minmax(0, 1fr) 148px 56px 60px 72px 80px; }
.row.week { grid-template-columns: minmax(0, 1fr) 84px 72px 72px 168px; }
.row.session { grid-template-columns: 8px minmax(0, 1fr) 120px 64px 76px 76px 80px; }
.row.project { grid-template-columns: 8px minmax(0, 1fr) 120px 64px 76px 76px 80px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.row.header { height: 32px; color: var(--muted); font-size: 12px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strong { font-weight: 500; }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.peak { display: flex; align-items: center; gap: 8px; }
.peak .meter { flex: 1 1 auto; height: 4px; }
.more { margin-top: 10px; height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 150ms ease; }
.empty { padding: 14px 10px; color: var(--muted); border-bottom: 1px solid var(--border); }
footer { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
footer p { margin: 0; }

@media (hover: hover) and (pointer: fine) {
  .nav:hover, .row:not(.header):hover, .more:hover { background: var(--hover); }
  .nav[aria-current="true"]:hover { background: var(--active); }
  .col:hover .tip { opacity: 1; transform: translate(-50%, 0); }
  .col:first-child:hover .tip, .col:last-child:hover .tip { transform: none; }
  .col:hover .bar { filter: brightness(1.08); }
}
@media (prefers-reduced-motion: reduce) {
  .seg .thumb, .seg button, .nav, .more { transition: none; }
  .tip { transition: opacity 125ms ease; }
  .seg button:active, .nav:active, .more:active { transform: none; }
}
@media (max-width: 760px) {
  .shell { flex-direction: column; align-items: stretch; }
  aside { position: static; min-height: 0; flex: none; padding: 12px 16px; gap: 12px; }
  nav { flex-direction: row; flex-wrap: wrap; }
  .appearance { margin-top: 0; padding: 0; max-width: 300px; }
  main { padding: 0 8px 8px; }
  .content { padding: 20px 16px 32px; }
  .topbar { padding: 0 16px; }
  .effort { grid-template-columns: 112px minmax(0, 1fr) 56px 44px; }
  .plot.days, .xlabels { gap: 4px; }
  .yaxis { width: 44px; }
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9h3l2-5 2 8 2-3h3"/></svg></div>
      <span data-en="Claude Usage">Claude 用量</span>
      <span class="tier" id="tier">-</span>
    </div>
    <nav aria-label="页面" data-en-label="Pages">
      <a class="nav" href="#overview" aria-current="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5h-4.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5h-4.5zM9 9h4.5v4.5H9z"/></svg><span data-en="Overview">概览</span></a>
      <a class="nav" href="#agents"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM3 13.5c.6-2.4 2.6-4 5-4s4.4 1.6 5 4"/></svg><span data-en="Subagents">子代理</span><span class="count mono" id="nav-agents"></span></a>
      <a class="nav" href="#sessions"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg><span data-en="Sessions">会话</span><span class="count mono" id="nav-sessions"></span></a>
      <a class="nav" href="#weeks"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11v9.5h-11zM2.5 7h11M5.5 2.5v3M10.5 2.5v3"/></svg><span data-en="Past weeks">往周</span><span class="count mono" id="nav-weeks"></span></a>
    </nav>
    <div class="appearance">
      <span class="label" id="appearance-label" data-en="Appearance">外观</span>
      <div class="seg" role="radiogroup" aria-labelledby="appearance-label" id="theme">
        <div class="thumb" style="width: calc((100% - 4px) / 3)"></div>
        <button role="radio" data-value="system"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-11zM6 13.5h4M8 10.5v3"/></svg><span data-en="System">系统</span></button>
        <button role="radio" data-value="light"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg><span data-en="Light">浅色</span></button>
        <button role="radio" data-value="dark"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg><span data-en="Dark">深色</span></button>
      </div>
      <span class="label" id="language-label" data-en="Language">语言</span>
      <div class="seg" role="radiogroup" aria-labelledby="language-label" id="language">
        <div class="thumb" style="width: calc((100% - 4px) / 3)"></div>
        <button role="radio" data-value="system"><span data-en="System">系统</span></button>
        <button role="radio" data-value="zh">中文</button>
        <button role="radio" data-value="en">English</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="panel">
      <div class="topbar">
        <span class="muted" data-en="Usage">用量</span>
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        <span class="strong" data-en="This week">本周</span>
        <span class="live"><span class="dot" id="dot"></span><span id="updated">-</span></span>
      </div>

      <div class="content">
        <section id="overview">
          <div class="head">
            <div>
              <h1 data-en="This week">本周</h1>
              <div class="sub" id="range">-</div>
            </div>
            <span class="badge calm" id="pace"></span>
          </div>
        </section>

        <div class="kpis" id="kpis"></div>

        <section>
          <div class="section-head">
            <div class="title"><h2 data-en="Usage">消耗</h2><span class="muted" id="chart-caption"></span></div>
            <div class="legend">
              <span id="chart-legend" class="legend"></span>
              <div class="seg small three" role="radiogroup" aria-label="图表范围" data-en-label="Chart range" id="range-seg">
                <div class="thumb" style="width: calc((100% - 4px) / 3)"></div>
                <button role="radio" data-value="curve" data-en="Cumulative">累计</button>
                <button role="radio" data-value="day" data-en="Daily">每天</button>
                <button role="radio" data-value="hour" data-en="Hourly">每小时</button>
              </div>
            </div>
          </div>
          <div class="chart-box"><div class="chart" id="chart"></div></div>
        </section>

        <div class="split">
          <section>
            <div class="section-head"><h2 data-en="By effort">按 effort</h2></div>
            <div id="efforts"></div>
            <div class="note" data-en="Orange is xhigh and max.">橙色是 xhigh 和 max。</div>
          </section>
          <section>
            <div class="section-head"><h2 data-en="By model">按模型</h2></div>
            <div class="stack" id="model-stack"></div>
            <div id="models"></div>
          </section>
        </div>

        <section id="agents">
          <div class="section-head"><div class="title"><h2 data-en="Subagents">子代理</h2><span class="muted" id="agents-caption"></span></div></div>
          <div class="kinds" id="agent-kinds"></div>
          <div class="table"><div class="rows" id="agent-rows"></div></div>
          <button class="more" id="agents-more" hidden></button>
        </section>

        <section id="sessions">
          <div class="section-head">
            <div class="title"><h2 data-en="Sessions">会话</h2><span class="muted" id="sessions-caption"></span></div>
            <div class="seg small" role="radiogroup" aria-label="分组" data-en-label="Group by" id="group-seg">
              <div class="thumb" style="width: calc(50% - 2px)"></div>
              <button role="radio" data-value="session" data-en="Session">会话</button>
              <button role="radio" data-value="project" data-en="Project">项目</button>
            </div>
          </div>
          <div class="table"><div class="rows" id="session-rows"></div></div>
          <button class="more" id="sessions-more" hidden></button>
        </section>

        <section id="weeks">
          <div class="section-head"><h2 data-en="Past weeks">往周</h2></div>
          <div class="table"><div class="rows" style="min-width: 620px" id="week-rows"></div></div>
          <div class="note" id="weeks-note" data-en="Sessions deleted before 10/14 left no record, so those weeks read low. A week whose official peak does not match its spend shows &quot;-&quot;.">10/14 之前删掉的会话没有记录，那几周金额偏低。官方最高读数和花费对不上的周显示“-”。</div>
        </section>

        <footer>
          <p data-en="Amounts are API-equivalent: each call's tokens priced at API list prices, as a measure of use. A subscription is not billed by it.">金额是 API 等价：把每次调用的 token 按 API 标价折算，用来衡量用量，订阅不按它收费。</p>
          <p id="method"></p>
          <p data-en="Counts Claude Code on this Mac only. Everything goes into a local database, so deleting a session later loses nothing.">只统计这台电脑上的 Claude Code。数据存进本地数据库，之后删掉会话也不会丢。</p>
        </footer>
      </div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const usd = (v) => '$' + (Math.abs(v) >= 100 ? Math.round(v).toLocaleString('en') : v.toFixed(2));
const pct0 = (v) => Math.round(v) + '%';
const axis = (v) => '$' + Math.round(v).toLocaleString('en');
const compact = (v) => Intl.NumberFormat('en', {notation: 'compact', maximumFractionDigits: 1}).format(v);
// Language: system, Chinese or English, remembered in this browser. "System" follows the browser.
let langSetting = 'system';
try { langSetting = localStorage.getItem('lang') || 'system'; } catch (e) {}
let lang = 'zh';
const L = (zh, en) => lang === 'en' ? en : zh;
const WEEKDAY = {zh: ['周日', '周一', '周二', '周三', '周四', '周五', '周六'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']};
const wd = (d) => WEEKDAY[lang][d.getDay()];
const md = (d) => (d.getMonth() + 1) + '/' + d.getDate();
const hm = (d) => lang === 'en'
  ? d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'})
  : d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit', hour12: false});
const dayTime = (s) => { const d = new Date(s); return wd(d) + ' ' + md(d) + ' ' + hm(d); };
const FAMILIES = ['opus', 'sonnet', 'fable', 'haiku', 'other'];
const FAMILY_NAME = {opus: 'Opus', sonnet: 'Sonnet', fable: 'Fable', haiku: 'Haiku', other: 'Other'};
const family = (m) => FAMILIES.find((f) => m.includes(f)) || 'other';
const modelName = (m) => {
  const f = family(m);
  const v = m.match(new RegExp(f + '-(\\d+)(?:-(\\d{1,2}))?(?!\\d)'));
  return (f === 'other' ? L('其他', 'Other') : FAMILY_NAME[f]) + (v ? ' ' + v[1] + (v[2] ? '.' + v[2] : '') : '');
};
const ago = (s, now) => {
  const min = (now - new Date(s)) / 60000;
  if (min < 1) return L('刚刚', 'just now');
  if (min < 60) return Math.floor(min) + L(' 分钟前', ' min ago');
  if (min < 48 * 60) return Math.floor(min / 60) + L(' 小时前', ' h ago');
  return md(new Date(s));
};
const niceMax = (v) => {
  const step = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
  return [1, 2, 2.5, 4, 5, 8, 10].map((m) => m * step).find((x) => x >= v);
};

// What the views show, worked out from one state the way the menu bar app's Usage does.
const derive = (s) => {
  const w = s.weekly, end = new Date(w.end);
  const rate = w.effective_dollars_per_pct || w.dollars_per_pct || 1;
  const runsOut = w.eta_full && (w.runs_out_early ?? new Date(w.eta_full) < end) ? new Date(w.eta_full) : null;
  const isActive = (x) => x.active ?? (new Date(s.now) - new Date(x.last) < 600000);
  const all = (s.all_sessions && s.all_sessions.length ? s.all_sessions : s.sessions)
    .slice().sort((a, b) => isActive(a) !== isActive(b) ? (isActive(a) ? -1 : 1) : b.total - a.total);
  return {
    rate, runsOut, isActive, sessions: all,
    burn: w.burn_pct_per_hour ?? s.burn_last_hour / w.dollars_per_pct,
    pct: (dollars) => dollars / rate,
  };
};

// Appearance: system, light or dark, remembered in this browser.
function segment(box, value) {
  const buttons = [...box.querySelectorAll('button')];
  const i = Math.max(0, buttons.findIndex((b) => b.dataset.value === value));
  buttons.forEach((b, j) => b.setAttribute('aria-checked', String(i === j)));
  box.querySelector('.thumb').style.transform = 'translateX(' + i * 100 + '%)';
}
function setTheme(value, save) {
  document.documentElement.dataset.theme = value;
  segment($('theme'), value);
  if (save) try { localStorage.setItem('theme', value); } catch (e) {}
}
$('theme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.value, true); });
setTheme(document.documentElement.dataset.theme, false);

function applyLanguage() {
  lang = langSetting === 'system' ? (/^zh/i.test(navigator.language) ? 'zh' : 'en') : langSetting;
  document.documentElement.lang = L('zh-CN', 'en');
  document.title = L('Claude 用量', 'Claude Usage');
  document.querySelectorAll('[data-en]').forEach((el) => {
    if (el.dataset.zh == null) el.dataset.zh = el.textContent;
    el.textContent = L(el.dataset.zh, el.dataset.en);
  });
  document.querySelectorAll('[data-en-label]').forEach((el) => {
    if (el.dataset.zhLabel == null) el.dataset.zhLabel = el.getAttribute('aria-label');
    el.setAttribute('aria-label', L(el.dataset.zhLabel, el.dataset.enLabel));
  });
  segment($('language'), langSetting);
}
$('language').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  langSetting = b.dataset.value;
  try { localStorage.setItem('lang', langSetting); } catch (e) {}
  applyLanguage();
  if (last) render(last);
});
applyLanguage();

let view = 'curve';
try { view = localStorage.getItem('chart') || 'curve'; } catch (e) {}
segment($('range-seg'), view);
$('range-seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.value; segment($('range-seg'), view);
  try { localStorage.setItem('chart', view); } catch (e) {}
  if (last) chart(last);
});

let group = 'session';
try { group = localStorage.getItem('group') || 'session'; } catch (e) {}
segment($('group-seg'), group);
$('group-seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  group = b.dataset.value; segment($('group-seg'), group);
  try { localStorage.setItem('group', group); } catch (e) {}
  if (last) sessions(last);
});
let showAllSessions = false;
$('sessions-more').addEventListener('click', () => { showAllSessions = !showAllSessions; if (last) sessions(last); });

let showAllAgents = false;
$('agents-more').addEventListener('click', () => { showAllAgents = !showAllAgents; if (last) agents(last); });

function header(s) {
  const w = s.weekly, now = new Date(s.now);
  const tier = s.tier.match(/max_(\d+x)/);
  $('tier').textContent = tier ? 'Max ' + tier[1] : s.tier.replace(/^default_claude_/, '');
  const day = Math.min(7, Math.floor(s.week_elapsed_days) + 1);
  $('range').textContent = L(dayTime(w.start) + ' 重置，' + dayTime(w.end) + ' 再重置 · 第 ' + day + ' 天，共 7 天',
    'Reset ' + dayTime(w.start) + ', resets ' + dayTime(w.end) + ' · day ' + day + ' of 7');
  const elapsed = s.week_elapsed_days / 7 * 100, diff = w.estimate - elapsed;
  const u = derive(s);
  const tail = w.estimate >= 100 ? L(' · 已用满', ' · full')
    : u.runsOut ? L(' · 按现在的速度 ' + dayTime(u.runsOut) + ' 用满', ' · at this pace, full by ' + dayTime(u.runsOut))
    : w.forecast_at_reset != null ? L(' · 按本周平均，重置时约 ', " · ~") + pct0(w.forecast_at_reset) + L('', " at reset at the week's average")
    : '';
  const up = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l4-4 3 3 4-5"/><path d="M10 5h4v4"/></svg>';
  const down = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5l4 4 3-3 4 5"/><path d="M10 11h4V7"/></svg>';
  const pace = $('pace');
  if (u.runsOut || diff > 1) { pace.className = 'badge warn'; pace.innerHTML = up + esc((diff > 1 ? L('比均匀用快 ' + Math.round(diff) + ' 个点', Math.round(diff) + ' points ahead of an even pace') : L('节奏正好', 'On pace')) + tail); }
  else if (diff < -1) { pace.className = 'badge ok'; pace.innerHTML = down + esc(L('比均匀用慢 ' + Math.round(-diff) + ' 个点', Math.round(-diff) + ' points behind an even pace') + tail); }
  else { pace.className = 'badge calm'; pace.textContent = L('节奏正好', 'On pace') + tail; }
  $('updated').textContent = L('实时 · ', 'Live · ') + now.toLocaleTimeString(L('zh-CN', 'en-US'), {hour12: lang === 'en'});
}

function kpis(s) {
  const w = s.weekly, h = s.five_hour, elapsed = s.week_elapsed_days / 7 * 100, u = derive(s);
  const level = (v, ahead) => v >= 90 ? 'var(--danger)' : v >= 70 || ahead ? 'var(--warn-fill)' : 'var(--opus)';
  const official = (m) => m.official == null ? L('暂无官方读数', 'No official reading yet') : L('估算 · 官方 ', 'Estimate · official ') + pct0(m.official);
  const items = [
    {label: L('每周额度', 'Weekly quota'), note: official(w), value: pct0(w.estimate), fill: w.estimate, official: w.official, color: level(w.estimate, w.estimate - elapsed > 1), tick: elapsed},
    h.start
      ? {label: L('5 小时窗口', '5-hour window'), note: hm(new Date(h.start)) + ' – ' + hm(new Date(h.end)), value: pct0(h.estimate), fill: h.estimate, official: h.official, color: level(h.estimate, false)}
      : {label: L('5 小时窗口', '5-hour window'), note: L('没有进行中的窗口', 'No open window'), value: '0%', fill: 0, color: 'var(--opus)'},
    {label: L('本周花费', 'Spent this week'), note: L('日均配额 ', 'Daily budget ') + usd(s.daily_budget), value: usd(s.week.total), fill: u.pct(s.week.total), color: 'var(--opus)'},
    agentKpi(s),
    {label: L('子代理占比', 'Subagent share'), note: L('最近 1 小时 ', 'Last hour ') + usd(s.burn_last_hour) + ' · ' + u.burn.toFixed(1) + '%', value: s.week.total ? pct0(s.week.subagent / s.week.total * 100) : '-', fill: s.week.total ? s.week.subagent / s.week.total * 100 : 0, color: 'var(--muted)'},
  ];
  $('kpis').innerHTML = items.map((k) => `
    <div class="kpi">
      <div class="kpi-top">${esc(k.label)}</div>
      <div class="kpi-value mono">${esc(k.value)}</div>
      <div class="track">
        ${k.stack ? `<div class="track-stack">${k.stack}</div>` : `<div class="fill" style="width:${Math.min(100, k.fill)}%;background:${k.color}"></div>`}
        ${k.official ? `<div class="official" style="width:${Math.min(100, k.official)}%"></div>` : ''}
        ${k.tick != null ? `<div class="tick" style="left:${Math.min(100, k.tick)}%"></div>` : ''}
      </div>
      <div class="kpi-note">${esc(k.note)}</div>
    </div>`).join('');
}

function agentKpi(s) {
  const c = s.agent_counts, today = s.week_days.findIndex((d) => d.state === 'current');
  const byFamily = FAMILIES.map((f) => [f, c.by_kind.filter((k) => k.family === f).reduce((a, k) => a + k.count, 0)]).filter(([, n]) => n);
  return {
    label: L('子代理数量', 'Subagents'), note: L('运行中 ', 'Running ') + c.active + L(' · 今天 ', ' · today ') + (today >= 0 ? c.per_day[today] : 0),
    value: c.total.toLocaleString('en'),
    stack: byFamily.map(([f, n]) => `<div title="${FAMILY_NAME[f]} ${n}" style="flex:${n} 1 0;background:var(--${f})"></div>`).join(''),
  };
}

function stackedBar(row, total) {
  return FAMILIES.filter((f) => row[f] > 0).map((f) => `<div style="background:var(--${f});height:${row[f] / total * 100}%"></div>`).join('');
}

function curve(s) {
  const w = s.weekly, u = derive(s), now = new Date(s.now);
  const t0 = new Date(w.start), t1 = new Date(w.end), span = t1 - t0;
  const x = (t) => Math.min(100, Math.max(0, (new Date(t) - t0) / span * 100));
  const y = (v) => (1 - Math.min(100, v) / 100) * 100;
  const pts = (s.week_curve && s.week_curve.length ? s.week_curve : [{t: w.start, pct: 0}, {t: s.now, pct: w.estimate}]);
  const line = pts.map((p) => x(p.t) * 10 + ',' + y(p.pct) * 2).join(' ');
  const nx = x(now), ny = y(w.estimate);
  const fast = u.burn > 0 ? (u.runsOut ? [u.runsOut, 100] : [t1, w.estimate + u.burn * (t1 - now) / 3600000]) : null;
  const seg = (a, b, stroke, dash, width) => `<line x1="${a[0] * 10}" y1="${a[1] * 2}" x2="${b[0] * 10}" y2="${b[1] * 2}" stroke="${stroke}" stroke-width="${width}" stroke-dasharray="${dash}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  $('chart-legend').innerHTML = [
    ['var(--opus)', 'solid', L('实际', 'Actual')],
    ...(fast ? [['var(--warn-fill)', 'dashed', L('按最近 1 小时', "At last hour's pace")]] : []),
    ...(w.forecast_at_reset != null ? [['var(--muted)', 'dotted', L('按本周平均', "At the week's average")]] : []),
    ['var(--faint)', 'dashed', L('时间进度', 'Time')],
  ].map(([c, st, t]) => `<span><i class="ln" style="border-top-color:${c};border-top-style:${st}"></i>${t}</span>`).join('');
  $('chart-caption').textContent = L('从重置起累计，占每周额度', 'Since the reset, in percent of the weekly quota');
  const days = s.week_days.map((d) => `<div class="${d.state === 'current' ? 'today' : ''}">${wd(new Date(d.start))}</div>`).join('');
  const full = u.runsOut ? `<div class="pt" style="left:${x(u.runsOut)}%;top:0;background:var(--warn-fill)"></div>
    <div class="label end" style="left:${x(u.runsOut)}%;top:0">${esc(L(dayTime(u.runsOut) + ' 用满', 'Full ' + dayTime(u.runsOut)))}</div>` : '';
  $('chart').innerHTML = `
    <div class="plot-wrap">
      <div class="curve" style="border-bottom:1px solid var(--border)">
        ${[25, 50, 75].map((v) => `<div class="grid-line" style="top:${y(v)}%"></div>`).join('')}
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
          ${seg([0, 100], [100, 0], 'var(--faint)', '4 4', 1)}
          ${w.forecast_at_reset != null ? seg([nx, ny], [100, y(w.forecast_at_reset)], 'var(--muted)', '1 5', 2) : ''}
          ${fast ? seg([nx, ny], [x(fast[0]), y(fast[1])], 'var(--warn-fill)', '6 4', 2) : ''}
          <polygon points="0,200 ${line} ${nx * 10},200" fill="var(--opus)" opacity=".08"/>
          <polyline points="${line}" fill="none" stroke="var(--opus)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        </svg>
        ${full}
        <div class="pt" style="left:${nx}%;top:${ny}%;background:var(--opus)"></div>
        <div class="label mono${nx > 88 ? ' edge' : ''}" style="left:${nx}%;top:${ny}%">${L('现在', 'Now')} ${pct0(w.estimate)}</div>
      </div>
      <div class="xlabels" style="gap:0">${days}</div>
    </div>
    <div class="yaxis mono">
      ${[100, 75, 50, 25, 0].map((v) => `<span style="top:${y(v)}%">${v}%</span>`).join('')}
    </div>`;
}

function chart(s) {
  if (view === 'curve') return curve(s);
  const rows = view === 'day' ? s.week_days : s.hours.slice(-48);
  const present = FAMILIES.filter((f) => rows.some((r) => r[f] > 0));
  $('chart-legend').innerHTML = (present.length ? present : ['opus']).map((f) => `<span><i class="sw" style="background:var(--${f})"></i>${FAMILY_NAME[f]}</span>`).join('');
  if (view === 'day') {
    const max = niceMax(Math.max(s.daily_budget * 1.15, ...s.week_days.map((d) => d.total)));
    const y = (v) => (1 - v / max) * 100;
    $('chart-caption').textContent = L('本周每天，从重置时刻起算 24 小时 · ', 'Each day of the week, 24 hours from the reset · ') + usd(s.week.total);
    const cols = s.week_days.map((d, i) => {
      const start = new Date(d.start), started = s.agent_counts.per_day[i];
      if (d.state === 'future') return '<div class="col"><div class="future"></div></div>';
      const parts = FAMILIES.filter((f) => d[f] > 0).map((f) => FAMILY_NAME[f] + ' ' + usd(d[f])).join(' · ');
      return `<div class="col">
        ${d.total > 0 ? `<div class="tip" style="bottom:calc(${d.total / max * 100}% + 8px)"><div class="strong">${wd(start)} ${md(start)} · ${usd(d.total)}</div><div class="mono">${esc(parts)}</div>${started ? `<div>${L('新开子代理 ' + started + ' 个', started + (started > 1 ? ' subagents started' : ' subagent started'))}</div>` : ''}</div>` : ''}
        <div class="bar" style="height:${d.total / max * 100}%">${stackedBar(d, d.total)}</div>
      </div>`;
    }).join('');
    const labels = s.week_days.map((d) => `<div class="${d.state === 'current' ? 'today' : ''}">${wd(new Date(d.start))}</div>`).join('');
    const yb = y(s.daily_budget);
    // Axis marks that would overlap the budget label are left out.
    const marks = [[0, axis(max)], [50, axis(max / 2)], [100, '$0']].filter(([top]) => Math.abs(top - yb) >= 9);
    $('chart').innerHTML = `
      <div class="plot-wrap">
        <div class="plot days">
          <div class="grid-line" style="top:50%"></div>
          <div class="budget-line" style="top:${yb}%"></div>
          ${cols}
        </div>
        <div class="xlabels">${labels}</div>
      </div>
      <div class="yaxis mono">
        ${marks.map(([top, text]) => `<span style="top:${top}%">${text}</span>`).join('')}
        <span class="strong" style="top:${yb}%">${L('日均', 'Daily')} ${axis(s.daily_budget)}</span>
      </div>`;
  } else {
    const totals = rows.map((h) => FAMILIES.reduce((a, f) => a + h[f], 0));
    const max = niceMax(Math.max(10, ...totals));
    $('chart-caption').textContent = L('最近 48 小时，每小时 · ', 'Last 48 hours, by hour · ') + usd(totals.reduce((a, b) => a + b, 0));
    const cols = rows.map((h, i) => {
      const t = new Date(h.hour);
      return `<div class="col">
        ${totals[i] > 0 ? `<div class="tip" style="bottom:calc(${totals[i] / max * 100}% + 8px)"><div class="strong">${wd(t)} ${hm(t)} · ${usd(totals[i])}</div></div>` : ''}
        <div class="bar" style="height:${totals[i] / max * 100}%">${stackedBar(h, totals[i])}</div>
      </div>`;
    }).join('');
    const ticks = [0, 12, 24, 36].filter((i) => rows[i]).map((i) => { const t = new Date(rows[i].hour); return '<div>' + wd(t) + ' ' + hm(t) + '</div>'; }).join('') + '<div>' + L('现在', 'Now') + '</div>';
    $('chart').innerHTML = `
      <div class="plot-wrap">
        <div class="plot hours"><div class="grid-line" style="top:50%"></div>${cols}</div>
        <div class="xlabels spread mono">${ticks}</div>
      </div>
      <div class="yaxis mono">
        <span style="top:0">${axis(max)}</span>
        <span style="top:50%">${axis(max / 2)}</span>
        <span style="top:100%">$0</span>
      </div>`;
  }
}

function breakdown(s) {
  const total = s.week.total || 1;
  $('efforts').innerHTML = s.week.by_effort.map((e) => {
    const [who, level] = e.key.split(' · ');
    const hot = level === 'xhigh' || level === 'max';
    const share = e.cost / total * 100;
    return `<div class="effort">
      <span class="muted">${who === 'sub' ? L('子代理', 'Subagent') : L('主会话', 'Main')} <span class="strong" style="color:var(--text)">${esc(level)}</span></span>
      <div class="meter"><div style="width:${share}%;background:${hot ? 'var(--warn-fill)' : 'var(--muted)'}"></div></div>
      <span class="mono right">${usd(e.cost)}</span>
      <span class="mono right muted">${share.toFixed(1)}%</span>
    </div>`;
  }).join('') || '<div class="empty">' + L('本周还没有调用。', 'No calls this week yet.') + '</div>';
  $('model-stack').innerHTML = s.week.by_model.map((m) => `<div style="width:${m.cost / total * 100}%;background:var(--${family(m.key)})"></div>`).join('');
  $('models').innerHTML = s.week.by_model.map((m) => `
    <div class="model">
      <i class="sw" style="background:var(--${family(m.key)})"></i>
      <span class="strong">${esc(modelName(m.key))}</span>
      <span class="mono muted">${m.calls.toLocaleString('en')}${L(' 次', ' calls')}</span>
      <span class="mono" style="margin-left:auto">${usd(m.cost)}</span>
      <span class="mono muted right" style="width:48px">${(m.cost / total * 100).toFixed(1)}%</span>
    </div>`).join('');
}

const LIVE_ICON = () => '<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="' + L('运行中', 'Running') + '"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--warn-fill)" stroke-width="1.5"/><path d="M7 3.5a3.5 3.5 0 0 1 0 7z" fill="var(--warn-fill)"/></svg>';
const DONE_ICON = () => '<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="' + L('已结束', 'Finished') + '"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--faint)" stroke-width="1.5"/><path d="M4.6 7.2l1.6 1.6 3.2-3.3" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function agents(s) {
  const now = new Date(s.now);
  const list = s.agents;
  const shown = showAllAgents ? list : list.slice(0, Math.max(12, s.active_agents));
  const c = s.agent_counts;
  $('agents-caption').textContent = L('本周 ' + c.total + ' 个 · ' + c.active + ' 个正在运行', c.total + ' this week · ' + c.active + ' running');
  $('agent-kinds').innerHTML = c.by_kind.map((k) => `<span class="chip"><i style="background:var(--${k.family})"></i>${FAMILY_NAME[k.family]}<span class="muted">${esc(k.effort)}</span><span class="mono">${k.count}</span>${k.median_cost > 0 ? `<span class="mono muted">· ${L('中位', 'median')} ${usd(k.median_cost)}</span>` : ''}</span>`).join('');
  $('nav-agents').textContent = s.active_agents || '';
  $('agent-rows').innerHTML = `<div class="row agent header"><span></span><span>${L('任务', 'Task')}</span><span>${L('模型', 'Model')}</span><span class="right">${L('调用', 'Calls')}</span><span class="right">${L('上下文', 'Context')}</span><span class="right">${L('API 等价', 'API equiv.')}</span><span class="right">${L('最后活动', 'Last')}</span></div>` +
    (shown.map((a) => `
    <div class="row agent" title="${esc(a.session_title)}">
      ${a.active ? LIVE_ICON() : DONE_ICON()}
      <span class="ellipsis strong">${esc(a.description ?? L('（无描述）', '(no description)'))}</span>
      <span class="chip"><i style="background:var(--${family(a.model)})"></i>${esc(modelName(a.model))}<span class="muted">${esc(a.effort)}</span></span>
      <span class="mono right muted">${a.calls}</span>
      <span class="mono right muted">${compact(a.context)}</span>
      <span class="mono right">${usd(a.cost)}</span>
      <span class="right muted">${ago(a.last, now)}</span>
    </div>`).join('') || '<div class="empty">' + L('本周还没有子代理。', 'No subagents this week yet.') + '</div>');
  const more = $('agents-more');
  more.hidden = list.length <= shown.length && !showAllAgents;
  more.textContent = showAllAgents ? L('收起', 'Show fewer') : L('显示全部 ' + list.length + ' 个', 'Show all ' + list.length);
}

function sessions(s) {
  const now = new Date(s.now), u = derive(s);
  const dot = (on) => on ? `<span class="live-dot" title="${L('最近 10 分钟有动静', 'Active in the last 10 minutes')}"></span>` : '<span></span>';
  const running = (n) => n ? ` <span class="muted" style="font-weight:400">· ${L(n + ' 个子代理运行中', n + ' subagent' + (n > 1 ? 's' : '') + ' running')}</span>` : '';
  const live = u.sessions.filter(u.isActive).length;
  $('nav-sessions').textContent = u.sessions.length || '';
  let rows, head, count;
  if (group === 'project') {
    const byName = new Map();
    for (const x of u.sessions) byName.set(x.project, [...(byName.get(x.project) || []), x]);
    const sum = (list, k) => list.reduce((a, x) => a + x[k], 0);
    const projects = [...byName].map(([name, list]) => ({name, list, active: list.some(u.isActive), total: sum(list, 'total')}))
      .sort((a, b) => a.active !== b.active ? (a.active ? -1 : 1) : b.total - a.total);
    count = projects.length;
    $('sessions-caption').textContent = L('本周 ' + count + ' 个项目 · 有绿点的最近 10 分钟有动静', count + ' projects this week · a green dot means activity in the last 10 minutes');
    head = `<div class="row project header"><span></span><span>${L('项目', 'Project')}</span><span class="right">${L('会话', 'Sessions')}</span><span class="right">${L('子代理', 'Subagents')}</span><span class="right">${L('主会话', 'Main')}</span><span class="right">${L('合计', 'Total')}</span><span class="right">${L('最后活动', 'Last')}</span></div>`;
    rows = projects.map((p) => `
    <div class="row project">
      ${dot(p.active)}
      <span class="ellipsis strong">${esc(p.name)}${running(sum(p.list, 'running'))}</span>
      <span class="mono right muted">${p.list.length}</span>
      <span class="mono right muted">${sum(p.list, 'agents')}</span>
      <span class="mono right muted">${usd(p.total - sum(p.list, 'sub'))}</span>
      <span class="mono right">${usd(p.total)}</span>
      <span class="right muted">${ago(p.list.map((x) => x.last).sort().pop(), now)}</span>
    </div>`);
  } else {
    count = u.sessions.length;
    $('sessions-caption').textContent = L('本周 ' + count + ' 个 · ' + live + ' 个进行中，排最前', count + ' this week · ' + live + ' active, listed first');
    head = `<div class="row session header"><span></span><span>${L('会话', 'Session')}</span><span>${L('项目', 'Project')}</span><span class="right">${L('子代理', 'Subagents')}</span><span class="right">${L('主会话', 'Main')}</span><span class="right">${L('合计', 'Total')}</span><span class="right">${L('最后活动', 'Last')}</span></div>`;
    rows = u.sessions.map((x) => `
    <div class="row session">
      ${dot(u.isActive(x))}
      <span class="ellipsis strong">${esc(x.title)}${running(x.running)}</span>
      <span class="ellipsis muted">${esc(x.project)}</span>
      <span class="mono right muted">${x.agents}</span>
      <span class="mono right muted">${usd(x.main)}</span>
      <span class="mono right">${usd(x.total)}</span>
      <span class="right muted">${ago(x.last, now)}</span>
    </div>`);
  }
  const shown = showAllSessions ? rows : rows.slice(0, 20);
  $('session-rows').innerHTML = head + (shown.join('') || '<div class="empty">' + L('本周还没有会话。', 'No sessions this week yet.') + '</div>');
  const more = $('sessions-more');
  more.hidden = rows.length <= 20;
  more.textContent = showAllSessions ? L('收起', 'Show fewer') : L('显示全部 ' + rows.length + ' 个', 'Show all ' + rows.length);
}

function weeks(s) {
  const first = s.weeks.findIndex((x) => x.total > 0 || x.official_peak != null);
  const list = s.weeks.slice(Math.max(0, first)).reverse();
  $('nav-weeks').textContent = list.length || '';
  $('week-rows').innerHTML = `<div class="row week header"><span>${L('额度周期', 'Window')}</span><span class="right">${L('API 等价', 'API equiv.')}</span><span class="right">${L('子代理', 'Subagents')}</span><span class="right">Sonnet</span><span>${L('官方最高读数', 'Official peak')}</span></div>` +
    list.map((w, i) => {
      // The current week uses the live totals; the history is cached for a minute.
      const cur = i === 0, total = cur ? s.week.total : w.total;
      const sub = cur ? s.week.subagent : w.subagent;
      const sonnet = cur ? s.week.by_model.filter((m) => family(m.key) === 'sonnet').reduce((a, m) => a + m.cost, 0) : w.sonnet;
      const share = (v) => total ? pct0(v / total * 100) : '-';
      const peak = (w.official_peak_trusted ?? true) ? w.official_peak : null;
      return `<div class="row week">
        <span class="strong">${md(new Date(w.start))} – ${md(new Date(w.end))}${cur ? ` <span class="muted" style="font-weight:400">${L('本周', 'this week')}</span>` : ''}</span>
        <span class="mono right">${axis(total)}</span>
        <span class="mono right muted">${share(sub)}</span>
        <span class="mono right muted">${share(sonnet)}</span>
        <span class="peak"><span class="meter"><div style="width:${peak ?? 0}%;background:${peak >= 90 ? 'var(--danger)' : 'var(--opus)'}"></div></span><span class="mono muted right" style="width:40px">${peak == null ? '-' : peak + '%'}</span></span>
      </div>`;
    }).join('');
}

function method(s) {
  const src = (m) => m.rate_source === 'calibrated' ? L('按 ' + Math.round(m.calibration_pct) + ' 个点的官方读数校准', 'calibrated on ' + Math.round(m.calibration_pct) + ' points of official readings') : L('默认值，还没校准', 'default, not calibrated yet');
  const w = s.weekly, h = s.five_hour;
  $('method').textContent = L(
    '估算 = 最近一次官方读数 + 之后的消耗 ÷ 每 1% 对应的金额：每周 ' + usd(w.dollars_per_pct) + '（' + src(w) + '），5 小时 ' + usd(h.dollars_per_pct) + '（' + src(h) + '）。'
      + (w.effective_dollars_per_pct ? '本周的花费按 ' + usd(w.effective_dollars_per_pct) + ' = 1% 折算，加起来正好是估算。' : ''),
    'Estimate = the last official reading + spend since ÷ dollars per 1%: weekly ' + usd(w.dollars_per_pct) + ' (' + src(w) + '), 5-hour ' + usd(h.dollars_per_pct) + ' (' + src(h) + ').'
      + (w.effective_dollars_per_pct ? " This week's spend is shared out at " + usd(w.effective_dollars_per_pct) + ' = 1%, which adds up to the estimate.' : ''));
}

function render(s) {
  header(s); kpis(s); chart(s); breakdown(s); agents(s); sessions(s); weeks(s); method(s);
  markSection();
}

// The sidebar marks the section in the middle of the screen, or the last one at the bottom of the page.
const navLinks = [...document.querySelectorAll('.nav')];
const SECTIONS = ['overview', 'agents', 'sessions', 'weeks'];
function markSection() {
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
  const middle = innerHeight / 2;
  const id = atBottom ? SECTIONS[SECTIONS.length - 1]
    : SECTIONS.filter((x) => $(x).getBoundingClientRect().top <= middle).pop() || SECTIONS[0];
  navLinks.forEach((a) => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + id)));
}
addEventListener('scroll', markSection, {passive: true});
addEventListener('resize', markSection);

let last = null;
async function tick() {
  try {
    const r = await fetch('/api/state', {cache: 'no-store'});
    last = await r.json();
    render(last);
    $('dot').classList.remove('stale');
  } catch (e) {
    $('dot').classList.add('stale');
    $('updated').textContent = L('连接断开，正在重试', 'Disconnected, retrying');
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
